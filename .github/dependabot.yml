version: 2
updates:
  # JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "monthly"
      day-of-month: "1"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      all-non-major:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  # GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "monthly"
      day-of-month: "1"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "monthly"
      day-of-month: "1"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
