services:
  sunflow:
    # Uses the public image built by GitHub Actions
    image: ghcr.io/robotnikz/sunflow:latest
    
    container_name: sunflow
    restart: unless-stopped
    
    ports:
      - "3000:3000"
      
    volumes:
      # Persist database and config (recommended: named volume = no host permission fiddling)
      - sunflow-data:/app/data

      # Alternative (advanced): bind mount to a host folder
      # - ./sunflow-data:/app/data
      
    environment:
      - TZ=Europe/Berlin

volumes:
  sunflow-data:
