version: '3.8'

services:
  sunflow:
    # Uses the public image built by GitHub Actions
    image: ghcr.io/robotnikz/sunflow:latest
    
    container_name: sunflow
    restart: unless-stopped
    
    ports:
      - "3000:3000"
      
    volumes:
      # Persist database and config
      # Use a named volume by default (best cross-platform; avoids bind-mount permission issues)
      - sunflow-data:/app/data
      
    environment:
      - TZ=Europe/Berlin

volumes:
  sunflow-data: